name: HelpDesk autotests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Start test server
        run: |
          npm run start:test > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          # Надежный цикл ожидания сервера через curl вместо wait-on
          for i in {1..30}; do
            curl -s http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "Server timeout!"
          exit 1

      - name: Run Cypress E2E tests
        run: npm run e2e

      - name: Show server logs on failure
        if: failure()
        run: cat server.log